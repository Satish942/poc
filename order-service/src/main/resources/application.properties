spring.application.name=order-service
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
spring.datasource.username=system
spring.datasource.password=YourOraclePassword123
spring.datasource.hikari.maximum-pool-size=2
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=orderuser

server.port=8081

logging.level.root=INFO
logging.level.com.orders=DEBUG

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
