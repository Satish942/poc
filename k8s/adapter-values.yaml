prometheus:
  url: http://prometheus.istio-system.svc.cluster.local
  port: 9090

rules:
  default: false
  custom:
    - seriesQuery: 'istio_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^(.*)_total"
        as: "${1}_per_second"
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'
